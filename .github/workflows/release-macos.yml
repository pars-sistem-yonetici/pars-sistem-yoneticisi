name: Sürüm yayınla (macOS)

# 1.5–1.9 aralığı için macOS derlemesi. Windows workflow'undan bağımsızdır:
# Windows exe/site işlerini tetiklemez, yalnızca imzasız DMG + ZIP yayınlar.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Yayınlanacak macOS sürüm (örn. 1.5.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  macos:
    # macos-latest artik arm64 ve kapasite kuyrugu nedeniyle atanamiyor.
    # Kullanici onayiyla GitHub-hosted Intel macOS runner kullaniliyor.
    runs-on: macos-15-intel
    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Sürümü belirle ve doğrula
        shell: bash
        run: |
          set -euo pipefail
          v='${{ github.event.inputs.version }}'
          if [[ ! "$v" =~ ^1\.[5-9]\.[0-9]+$ ]]; then
            echo "Geçersiz macOS sürümü: $v (beklenen 1.5.x–1.9.x)" >&2
            exit 1
          fi
          pkg=$(node -p "require('./package.json').version")
          if [ "$pkg" != "$v" ]; then
            echo "package.json sürümü ($pkg) ile yayın sürümü ($v) uyuşmuyor." >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$v" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$v" >> "$GITHUB_ENV"

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Derle
        run: npm run build

      - name: POSIX IPC smoke testi
        env:
          PARS_IPC_SMOKE: '1'
        run: npm run smoke:posix

      - name: İmzasız DMG ve ZIP üret
        run: npx electron-builder --mac --publish never

      - name: SHA-256 özetleri
        shell: bash
        run: shasum -a 256 release/*.dmg release/*.zip > release/SHA256SUMS-macOS.txt

      - name: macOS dosyalarını release’a yükle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Pars Sistem Yöneticisi $RELEASE_VERSION (macOS)" \
              --notes-file RELEASE_NOTES_MACOS.md \
              --latest=false
          fi
          gh release upload "$RELEASE_TAG" \
            release/*.dmg \
            release/*.zip \
            release/SHA256SUMS-macOS.txt \
            --clobber
