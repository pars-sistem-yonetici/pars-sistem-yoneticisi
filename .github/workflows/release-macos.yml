name: Sürüm yayınla (macOS deneysel)

# 1.5–1.9 aralığı için deneysel macOS derlemesi. Windows workflow'undan bağımsızdır:
# Windows exe/site işlerini tetiklemez, yalnızca imzasız DMG + ZIP yayınlar.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Yayınlanacak deneysel sürüm (örn. 1.5.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  macos:
    # macos-latest artik arm64 ve kapasite kuyrugu nedeniyle atanamiyor.
    # Kullanici onayiyla GitHub-hosted Intel macOS runner kullaniliyor.
    runs-on: macos-15-intel
    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Sürümü belirle ve doğrula
        shell: bash
        run: |
          set -euo pipefail
          v='${{ github.event.inputs.version }}'
          if [[ ! "$v" =~ ^1\.[5-9]\.[0-9]+$ ]]; then
            echo "Geçersiz deneysel macOS sürümü: $v (beklenen 1.5.x–1.9.x)" >&2
            exit 1
          fi
          pkg=$(node -p "require('./package.json').version")
          if [ "$pkg" != "$v" ]; then
            echo "package.json sürümü ($pkg) ile yayın sürümü ($v) uyuşmuyor." >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$v" >> "$GITHUB_ENV"
          # Windows release.yml yalnizca *.*.* etiketlerinde tetiklenir.
          # macOS deneysel etiketi bu deseni eslestirmesin; noktalari alt cizgiye ceviriyoruz.
          safe_tag=$(echo "$v" | tr '.' '_')
          echo "RELEASE_TAG=macos-experimental-$safe_tag" >> "$GITHUB_ENV"

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Derle
        run: npm run build

      - name: POSIX IPC smoke testi
        env:
          PARS_IPC_SMOKE: '1'
        run: npm run smoke:posix

      - name: İmzasız DMG ve ZIP üret
        run: npx electron-builder --mac --publish never

      - name: SHA-256 özetleri
        shell: bash
        run: shasum -a 256 release/*.dmg release/*.zip > release/SHA256SUMS-macOS.txt

      - name: Deneysel GitHub Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Pars Sistem Yoneticisi ${{ env.RELEASE_VERSION }} (macOS deneysel)
          body_path: RELEASE_NOTES_MACOS.md
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS-macOS.txt
